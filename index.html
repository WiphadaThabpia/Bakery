<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bakery 3D</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    canvas {
      display: block;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>

<body>

<script>

  // Scene
  const scene = new THREE.Scene();

  // พื้นหลังสีครีมอ่อน
  scene.background = new THREE.Color(0xFFF4E3);


  // Camera
  const camera = new THREE.PerspectiveCamera(
    50,
    innerWidth / innerHeight,
    0.1,
    100
  );


  // Renderer
  const renderer = new THREE.WebGLRenderer({
    antialias: true
  });

  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

  // ให้สีจาก GLB แสดงใกล้เคียงสีต้นฉบับ
  renderer.outputEncoding = THREE.sRGBEncoding;

  document.body.appendChild(renderer.domElement);


  // Controls
  const controls = new THREE.OrbitControls(
    camera,
    renderer.domElement
  );

  controls.enableDamping = true;

  // ไม่ให้ซูมใกล้/ไกลเกินไป
  controls.minDistance = 5;
  controls.maxDistance = 30;


  // -------------------------
  // LIGHT
  // -------------------------

  // แสงโดยรวมแบบนุ่ม ๆ
  const ambientLight = new THREE.AmbientLight(
    0xffffff,
    1.5
  );

  scene.add(ambientLight);


  // แสงด้านบน/ด้านหน้า
  const light = new THREE.DirectionalLight(
    0xffffff,
    1.2
  );

  light.position.set(5, -8, 12);

  scene.add(light);


  // -------------------------
  // LOAD BAKERY
  // -------------------------

  const loader = new THREE.GLTFLoader();

  loader.load(
    'Bekery.glb',

    function (gltf) {

      const bakery = gltf.scene;

      scene.add(bakery);


      // หา Bounding Box ของร้าน
      const box = new THREE.Box3().setFromObject(bakery);

      const center = new THREE.Vector3();

      box.getCenter(center);


      const size = new THREE.Vector3();

      box.getSize(size);


      // -------------------------
      // CAMERA
      // -------------------------

      // ให้กล้องมองตรงหน้าร้าน
      camera.position.set(
        center.x,
        box.min.y - size.y * 1.8,
        center.z + size.z * 0.35
      );


      // จุดที่กล้องมอง
      controls.target.set(
        center.x,
        center.y,
        center.z * 0.9
      );


      camera.lookAt(controls.target);


      // ปรับระยะกล้องให้เห็นร้านครบ
      controls.update();


      console.log('Bakery loaded');
      console.log('Size:', size);
    },

    function (xhr) {

      console.log(
        (xhr.loaded / xhr.total * 100) +
        '% loaded'
      );

    },

    function (error) {

      console.error(
        'โหลด Bekery.glb ไม่สำเร็จ',
        error
      );

    }
  );


  // -------------------------
  // RESIZE
  // -------------------------

  addEventListener('resize', () => {

    camera.aspect =
      innerWidth / innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

    renderer.setPixelRatio(
      Math.min(devicePixelRatio, 2)
    );

  });


  // -------------------------
  // ANIMATION
  // -------------------------

  function animate() {

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(
      scene,
      camera
    );

  }

  animate();

</script>

</body>
</html>
