<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model - Bakery</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #87CEEB; /* สีฟ้าท้องฟ้า */
        }
        canvas { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
        }
    </style>
</head>
<body>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>

    <script>
        // 1. Setup Scene & Camera
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // เปลี่ยนพื้นหลังเป็นสีฟ้าท้องฟ้า (Sky Blue)

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.position.set(0, 1.5, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 2. ปรับลดแสงลง ไม่ให้สว่างจ้าเกินไป
        // AmbientLight: แสงโดยรอบ (ลดจาก 1.5 เหลือ 0.6)
        const ambientLight = new THREE.AmbientLight(0xfff8ed, 0.6); 
        scene.add(ambientLight);

        // DirectionalLight: แสงเงา/แสงหลัก (ลดจาก 2.0 เหลือ 0.8)
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7.5);
        scene.add(directionalLight);

        // 3. โหลดโมเดล 3D
        const loader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);

        loader.load('./Bekery.glb', (gltf) => {
            const model = gltf.scene;

            // จัดตำแหน่งโมเดลให้อยู่จุดศูนย์กลาง
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            model.position.sub(center);

            scene.add(model);
            console.log("โหลดโมเดลสำเร็จ!");
        }, undefined, (error) => {
            console.error('เกิดข้อผิดพลาดในการโหลดโมเดล:', error);
        });

        // 4. Loop Render
        function animate() {
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        // ปรับขนาดตามหน้าจอ
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
